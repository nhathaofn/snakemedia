name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # release.yml runs the same checks before it builds anything.
  workflow_call:

jobs:
  validate:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      # Must run before any Go step: main.go embeds frontend/dist via //go:embed.
      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Lint & format check (frontend)
        run: |
          npm --prefix frontend run lint
          npm --prefix frontend run format:check

      - name: Test (frontend)
        run: npm --prefix frontend run test

      - name: Format check (Go)
        run: go run ./tools/gofmtcheck

      - name: Vet & test (Go)
        run: |
          go vet ./...
          go test ./...

      - name: Build (Go)
        run: go build ./...

      # The CLI matches the wails module in go.mod, so a build never rewrites go.mod.
      - name: Install Wails CLI
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"

      - name: Bindings are up to date
        run: |
          wails generate module
          $changed = git status --porcelain -- frontend/wailsjs
          if ($changed) {
            Write-Output $changed
            throw 'frontend/wailsjs is out of date: run "wails generate module" and commit the result.'
          }
