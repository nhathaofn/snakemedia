name: Release

# Push a tag vX.Y.Z whose version equals info.productVersion in wails.json.
# The release carries the installer, the portable exe and SHA256SUMS.txt; the
# app's updater (internal/updater) reads exactly these names.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tag matches wails.json
        id: meta
        run: |
          $manifest = Get-Content wails.json -Raw | ConvertFrom-Json
          $version = $manifest.info.productVersion
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$version") {
            throw "Tag $tag does not match info.productVersion $version in wails.json"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "name=$($manifest.name)" >> $env:GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Install Wails CLI and NSIS
        run: |
          $version = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2
          go install "github.com/wailsapp/wails/v2/cmd/wails@$version"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          }

      - name: Build installer
        run: |
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $ldflags = "-X SnakeMedia/internal/buildinfo.commit=${{ github.sha }} -X SnakeMedia/internal/buildinfo.buildDate=$date"
          wails build -clean -platform windows/amd64 -nsis -trimpath -ldflags "$ldflags"

      - name: Collect release files
        run: |
          $name = '${{ steps.meta.outputs.name }}'
          $version = '${{ steps.meta.outputs.version }}'
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item "build/bin/$name-amd64-installer.exe" "dist-release/$name-$version-windows-amd64-setup.exe"
          Copy-Item "build/bin/$name.exe" "dist-release/$name-$version-windows-amd64-portable.exe"
          Push-Location dist-release
          Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.Name -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: dist-release/*
